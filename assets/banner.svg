<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .glow-orb {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.7; }
    }
    @keyframes dash {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -400; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Background Decorative Glow Orbs -->
  <circle cx="150" cy="90" r="180" fill="url(#glow-grad)" class="glow-orb"/>
  <circle cx="1050" cy="270" r="220" fill="url(#glow-grad)" class="glow-orb"/>

  <!-- Background Dynamic Flow Network Lines -->
  <g stroke="url(#accent-cyan)" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 100 280 C 250 320, 350 220, 500 270 C 650 320, 800 200, 1100 260" class="flow-line"/>
    <path d="M 50 100 C 300 40, 450 160, 700 80 C 900 20, 1050 120, 1150 70" class="flow-line"/>
  </g>

  <!-- Side Decorative Cards / Badges -->
  <g transform="translate(900, 45)">
    <rect width="220" height="42" rx="21" fill="url(#card-bg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="22" cy="21" r="6" fill="#10b981"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Pipeline Automation</text>
  </g>

  <g transform="translate(80, 270)">
    <rect width="210" height="42" rx="21" fill="url(#card-bg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="22" cy="21" r="6" fill="#3b82f6"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Quote-to-Cash Ready</text>
  </g>

  <!-- FOREGROUND CONTENT -->
  <!-- Top Badge -->
  <g transform="translate(460, 48)">
    <rect width="280" height="32" rx="16" fill="url(#card-bg)" stroke="url(#accent-purple)" stroke-width="1.5"/>
    <text x="140" y="20" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED SFA ECOSYSTEM</text>
  </g>

  <!-- Main Title Line 1 -->
  <text x="600" y="140" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
    Awesome Sales Force Automation
  </text>

  <!-- Main Title Line 2 -->
  <text x="600" y="190" text-anchor="middle" fill="url(#accent-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    &amp; Self-Hosted CRM Platforms
  </text>

  <!-- Subtitle -->
  <text x="600" y="242" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2">
    Enterprise Commercial SaaS • Open-Source Repositories • Quote-to-Cash &amp; Lead Management
  </text>

  <!-- Footer Highlights -->
  <text x="600" y="292" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
    SuiteCRM &nbsp;•&nbsp; Twenty &nbsp;•&nbsp; Odoo &nbsp;•&nbsp; EspoCRM &nbsp;•&nbsp; Salesforce &nbsp;•&nbsp; Dynamics 365
  </text>
</svg>
