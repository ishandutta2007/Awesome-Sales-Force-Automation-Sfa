<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .pulse-glow { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 8, 8; animation: dash 3s linear infinite; }
    .floating-card { animation: float-slow 5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Background Decorative Dynamic Glow Orbs (Strictly in Background) -->
  <circle cx="150" cy="90" r="180" fill="url(#glow-grad)" class="pulse-glow"/>
  <circle cx="1050" cy="270" r="220" fill="url(#glow-grad)" class="pulse-glow"/>

  <!-- Background Dynamic Flow Network Lines (Behind text) -->
  <g stroke="url(#accent-cyan)" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M 100 280 C 250 320, 350 220, 500 270 C 650 320, 800 200, 1100 260" />
    <path d="M 50 100 C 300 40, 450 160, 700 80 C 900 20, 1050 120, 1150 70" class="animated-line"/>
  </g>

  <!-- Dynamic Animated Floating Pills / Nodes (Background/Side Elements) -->
  <g class="floating-card" opacity="0.6">
    <rect x="900" y="45" width="220" height="42" rx="21" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="922" cy="66" r="6" fill="#10b981"/>
    <text x="938" y="71" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Pipeline Automation Active</text>
  </g>

  <g class="floating-card" style="animation-delay: -2.5s;" opacity="0.6">
    <rect x="80" y="270" width="210" height="42" rx="21" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="102" cy="291" r="6" fill="#3b82f6"/>
    <text x="118" y="296" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Quote-to-Cash Ready</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Completely Unobstructed) -->
  <!-- Top Pill / Badge -->
  <g transform="translate(600, 65)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="url(#card-grad)" stroke="url(#accent-purple)" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED SFA ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Awesome Sales Force Automation
  </text>
  <text x="600" y="195" text-anchor="middle" fill="url(#accent-cyan)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    &amp; Self-Hosted CRM Platforms
  </text>

  <!-- Subtitle -->
  <text x="600" y="248" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
    Enterprise Commercial SaaS • Open-Source GitHub Repositories • Quote-to-Cash &amp; Lead Management
  </text>

  <!-- Feature Highlights Row -->
  <g transform="translate(600, 295)">
    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
      ⚡ SuiteCRM &nbsp;•&nbsp; ⚡ Twenty &nbsp;•&nbsp; ⚡ Odoo &nbsp;•&nbsp; ⚡ EspoCRM &nbsp;•&nbsp; ⚡ Salesforce &nbsp;•&nbsp; ⚡ Dynamics 365
    </text>
  </g>
</svg>
